  /workspaces/yoctoprojectarabic/yocto-5.0.20/poky/meta-yocto-bsp \
  /workspaces/yoctoprojectarabic/yocto-5.0.20/meta-openjdk-temurin \
  /workspaces/yoctoprojectarabic/yocto-5.0.20/meta-java17-image \
